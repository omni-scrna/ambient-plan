name: ambient-rna-benchmark
id: ambient_rna_benchmark
description: Benchmark of ambient RNA removal methods for scRNA-seq
benchmarker: "Marusa Koderman"

# benchmark configuration
version: "0.1.0"
api_version: "0.8.0"

software_backend: "conda"

software_environments:
  r_conda:
    name: R conda env (data download, cell calling, demultiplexing, concatenation)
    conda: envs/r.yml
  r_cleaning:
    name: R ambient removal methods (DecontX)
    conda: envs/r_cleaning.yml
  r_doublets:
    name: R doublet detection (scDblFinder)
    conda: envs/r_doublets.yml
  scrapper:
    name: scrapper (filtering)
    conda: envs/scrapper.yml
  #cellbender:
  #  name: CellBender
  #  conda: envs/cellbender.yml
  py_cleaning:
    name: Python ambient removal methods (scAR)
    conda: envs/py_cleaning.yml
  cellclear:
    name: CellClear (pip-only, own pinned env)
    conda: envs/cellclear.yml

stages:
  - id: data_download
    outputs:
      - id: rawdata_h5ad
        path: "{pool_id}/raw.h5ad"
        foreach: pool_id
      - id: properties_info
        path: "{name}_properties.yaml"
    modules:
      - id: d_mixed_species
        name: "HGMM dataset downloads"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/ambient-data-download
          commit: 8064b49
        parameters:
          - dataset_name: hgmm_10x
            batch_var: pool_id
            sample_var: sample_id
            labels_var: null
            tenx_assay: polyA
      - id: d_hto
        name: "HTO-hashed dataset downloads"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/ambient-data-download
          commit: 8064b49
        parameters:
          - dataset_name: human_pbmcs_hto_10x
            batch_var: pool_id
            sample_var: sample_id
            labels_var: null
            tenx_assay: polyA
      - id: d_flex
        name: "Flex dataset downloads"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/ambient-data-download
          commit: 8064b49
        parameters:
          - dataset_name: mouse_cell_lines_flex_10x
            batch_var: pool_id
            sample_var: sample_id
            labels_var: cell_line
            tenx_assay: flex
            
  - id: cell_calling
    inputs:
      - rawdata_h5ad
      - properties_info
    outputs:
      - id: called_cells_tsv
        path: "{name}_called_cells.tsv"
    modules:
      - id: emptydrops
        name: "EmptyDrops cell calling"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/cell-calling
          commit: 530427f

  - id: demultiplexing
    inputs:
      - rawdata_h5ad
      - called_cells_tsv
    outputs:
      - id: demultiplexed_tsv
        path: "{name}_demultiplexed.tsv"
    modules:
      - id: dm_mixed_species
        name: "Species demultiplexing"
        exclude: [d_hto, d_flex]
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/demultiplexing
          commit: 6d04d60
          entrypoint: demultiplex_mixed_species
      - id: dm_hto
        name: "HTO demultiplexing"
        exclude: [d_mixed_species, d_flex]
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/demultiplexing
          commit: 6d04d60
          entrypoint: demultiplex_hto
      - id: dm_flex
        name: "Flex demultiplexing"
        exclude: [d_mixed_species, d_hto]
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/demultiplexing
          commit: 6d04d60
          entrypoint: demultiplex_flex

  - id: cleaning
    inputs:
      - rawdata_h5ad
      - called_cells_tsv
    outputs:
      - id: filtered_h5ad
        path: "{name}.h5ad"
    modules:
      - id: decontx
        name: "DecontX ambient removal"
        software_environment: r_cleaning
        repository:
          url: https://github.com/omni-scrna/ambient-r
          commit: 532dd48
          entrypoint: decontx
        parameters:
          - use_background: ["true", "false"]
      - id: no_cleaning
        name: "No ambient removal"
        software_environment: r_cleaning
        repository:
          url: https://github.com/omni-scrna/ambient-r
          commit: 532dd48
          entrypoint: passthrough
      - id: scar
        name: "scAR ambient removal"
        software_environment: py_cleaning
        repository:
          url: https://github.com/omni-scrna/ambient-py
          commit: feat/scar-cellclear
          entrypoint: scar
        parameters:
          - epochs: "200"
      - id: cellclear
        name: "CellClear ambient removal"
        software_environment: cellclear
        resources:
          cores: 4   # CellClear runs 4 worker processes (hard-coded)
        repository:
          url: https://github.com/omni-scrna/ambient-py
          commit: feat/scar-cellclear
          entrypoint: cellclear


  # - id: cell_calling_and_cleaning
  #   inputs:
  #     - rawdata_h5ad
  #   outputs:
  #     - id: filtered_h5ad
  #       path: "{name}.h5ad"
  #   modules:
  #     - id: cellbender
  #       name: "CellBender ambient removal + cell calling"
  #       software_environment: cellbender
  #       requires_capabilities: [gpu]
  #       repository:
  #         url: https://github.com/omni-scrna/ambient-py
  #         commit: 9d28c32
  #         entrypoint: cellbender


  - id: concatenate_dataset
    inputs:
      - filtered_h5ad
      - demultiplexed_tsv
    over: pool_id
    outputs:
      - id: dataset_h5ad
        path: "{name}.h5ad"
    modules:
      - id: concatenate
        name: "Concatenate pools, join species labels"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/demultiplexing
          commit: 6d04d60
          entrypoint: concatenate

  - id: doublets
    inputs:
      - dataset_h5ad
    outputs:
      - id: doublets_tsv
        path: "{name}_doublets.tsv"
    modules:
      - id: scdblfinder
        name: "scDblFinder doublet detection"
        software_environment: r_doublets
        repository:
          url: https://github.com/omni-scrna/doublets-r
          commit: main


