name: ambient-rna-benchmark
id: ambient_rna_benchmark
description: Benchmark of ambient RNA removal methods for scRNA-seq
benchmarker: "Marusa Koderman"

# benchmark configuration
version: "0.1.0"
api_version: "0.8.0"

software_backend: "conda"

software_environments:
  r_conda:
    name: R conda env (data download, cell calling, demultiplexing, concatenation)
    conda: envs/r.yml
  r_cleaning:
    name: R ambient removal methods (DecontX)
    conda: envs/r_cleaning.yml
  r_doublets:
    name: R doublet detection (scDblFinder)
    conda: envs/r_doublets.yml
  scrapper:
    name: scrapper (filtering)
    conda: envs/scrapper.yml
  #cellbender:
  #  name: CellBender
  #  conda: envs/cellbender.yml
  py_cleaning:
    name: Python ambient removal methods (scAR)
    conda: envs/py_cleaning.yml
  cellclear:
    name: CellClear (pip-only, own pinned env)
    conda: envs/cellclear.yml
  py_metrics:
    name: Python metrics (ambient-metrics)
    conda: envs/py_metrics.yml

stages:
  - id: DATA_RAW
    provides: [multiplexing]   # lineage label; demultiplexing modules gate on it with `requires`
    outputs:
      - id: rawdata_h5ad
        path: "{pool_id}/raw.h5ad"
        foreach: pool_id
      - id: properties_info
        path: "{name}_properties.yaml"
    modules:
      - id: d_mixed_species
        name: "HGMM dataset downloads"
        provides: {multiplexing: mixed_species}
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/ambient-data-download
          commit: 70d02db
        parameters:
          - dataset_name: hgmm_10x
            batch_var: pool_id
            sample_var: sample_id
            labels_var: null
            tenx_assay: polyA
      - id: d_hto
        name: "HTO-hashed dataset downloads"
        provides: {multiplexing: hto}
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/ambient-data-download
          commit: 70d02db
        parameters:
          - dataset_name: human_pbmcs_hto_10x
            batch_var: pool_id
            sample_var: sample_id
            labels_var: null
            tenx_assay: polyA
      - id: d_flex
        name: "Flex dataset downloads"
        provides: {multiplexing: flex}
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/ambient-data-download
          commit: 70d02db
        parameters:
          - dataset_name: mouse_cell_lines_flex_10x
            batch_var: pool_id
            sample_var: sample_id
            labels_var: cell_line
            tenx_assay: flex
            
  - id: CELLCALL
    inputs:
      - rawdata_h5ad
      - properties_info
    outputs:
      - id: called_cells_tsv
        path: "{name}_called_cells.tsv"
    modules:
      - id: emptydrops
        name: "EmptyDrops cell calling"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/cell-calling
          commit: f089cab

  # The count matrix the ambient removal methods run on. Every method runs once
  # per variant: on the raw counts, and on merged counts where a merge applies
  # to the dataset (gated on DATA_RAW's `multiplexing` label).
  - id: PREP
    provides: [counts]   # lineage label: which variant a downstream node ran on
    inputs:
      - rawdata_h5ad
      - called_cells_tsv
    outputs:
      - id: prepared_h5ad
        path: "{name}_prepared.h5ad"
      - id: prepared_cells_tsv
        path: "{name}_prepared_cells.tsv"
    modules:
      - id: as_is
        name: "Raw counts and called cells, unchanged"
        provides: {counts: raw}
        software_environment: r_cleaning
        repository:
          url: https://github.com/omni-scrna/ambient-r
          commit: 17a9b36
          entrypoint: prep
        parameters:
          - merge: none
      - id: merge_orthologs
        name: "Human and mouse 1:1 orthologs summed into one feature"
        requires: {multiplexing: mixed_species}
        provides: {counts: orthologs}
        software_environment: r_cleaning
        repository:
          url: https://github.com/omni-scrna/ambient-r
          commit: 17a9b36
          entrypoint: prep
        parameters:
          - merge: orthologs
      - id: merge_gems
        name: "GEM x probe columns of one GEM barcode summed into one cell"
        requires: {multiplexing: flex}
        provides: {counts: gems}
        software_environment: r_cleaning
        repository:
          url: https://github.com/omni-scrna/ambient-r
          commit: 17a9b36
          entrypoint: prep
        parameters:
          - merge: gems

  - id: CLUSTER
    inputs:
      - rawdata_h5ad
      - called_cells_tsv
    outputs:
      - id: clusters_tsv
        path: "{name}_clusters.tsv"
    modules:
      - id: scrapper_louvain
        name: "scrapper graph clustering (HVGs, PCA, SNN, multilevel/Louvain)"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/ambient-clustering
          commit: a95c834
        parameters:
          - resolution: ["0.1", "1"]

  - id: DEMUX
    inputs:
      - rawdata_h5ad
      - called_cells_tsv
    outputs:
      - id: demultiplexed_tsv
        path: "{name}_demultiplexed.tsv"
    modules:
      - id: dm_mixed_species
        name: "Species demultiplexing"
        requires: {multiplexing: mixed_species}
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/demultiplexing
          commit: 6d04d60
          entrypoint: demultiplex_mixed_species
      - id: dm_hto
        name: "HTO demultiplexing"
        requires: {multiplexing: hto}
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/demultiplexing
          commit: 6d04d60
          entrypoint: demultiplex_hto
      - id: dm_flex
        name: "Flex demultiplexing"
        requires: {multiplexing: flex}
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/demultiplexing
          commit: 6d04d60
          entrypoint: demultiplex_flex

  - id: AMBIENT
    inputs:
      - prepared_h5ad
      - prepared_cells_tsv
    outputs:
      - id: filtered_h5ad
        path: "{name}.h5ad"
    modules:
      - id: decontx
        name: "DecontX ambient removal"
        software_environment: r_cleaning
        repository:
          url: https://github.com/omni-scrna/ambient-r
          commit: 17a9b36
          entrypoint: decontx
        parameters:
          - use_background: ["true", "false"]
      - id: no_cleaning
        name: "No ambient removal"
        software_environment: r_cleaning
        repository:
          url: https://github.com/omni-scrna/ambient-r
          commit: 17a9b36
          entrypoint: passthrough
      - id: scar
        name: "scAR ambient removal"
        software_environment: py_cleaning
        repository:
          url: https://github.com/omni-scrna/ambient-py
          commit: a1bf4dd
          entrypoint: scar
        parameters:
          - epochs: "200"
      - id: cellclear
        name: "CellClear ambient removal"
        software_environment: cellclear
        resources:
          cores: 4   # CellClear runs 4 worker processes (hard-coded)
        repository:
          url: https://github.com/omni-scrna/ambient-py
          commit: a1bf4dd
          entrypoint: cellclear


  # - id: CELLCALL_AMBIENT
  #   inputs:
  #     - rawdata_h5ad
  #   outputs:
  #     - id: filtered_h5ad
  #       path: "{name}.h5ad"
  #   modules:
  #     - id: cellbender
  #       name: "CellBender ambient removal + cell calling"
  #       software_environment: cellbender
  #       requires_capabilities: [gpu]
  #       repository:
  #         url: https://github.com/omni-scrna/ambient-py
  #         commit: 9d28c32
  #         entrypoint: cellbender


  # Each method's output against the matrix it was given (its PREP variant).
  - id: AMBIENT_M
    inputs:
      - prepared_h5ad
      - filtered_h5ad
      - demultiplexed_tsv
    outputs:
      - id: ambient_metrics_json
        path: "{name}_ambient_metrics.json"
    modules:
      - id: ambient_metrics
        name: "Count inflation + barnyard (cross-species) metrics"
        software_environment: py_metrics
        repository:
          url: https://github.com/omni-scrna/ambient-metrics
          commit: f056586

  # Raw vs. merged counts, per method: does removing ambient RNA and then
  # merging give what merging first gives? One node per dataset (`group_by`),
  # cell caller and method + parameters (`split_by`); its members are that
  # method's outputs on every PREP variant and pool. PREP is not named, so its
  # variants land in the same node.
  - id: MERGE_M
    gather:
      from: [filtered_h5ad]
      group_by: DATA_RAW
      split_by: [CELLCALL, AMBIENT]
    outputs:
      - id: merge_metrics_json
        path: "{name}_merge_metrics.json"
    modules:
      - id: merge_metrics
        name: "Method output on raw vs. merged counts"
        software_environment: py_metrics
        repository:
          url: https://github.com/omni-scrna/ambient-metrics
          commit: f056586
          entrypoint: compare

  - id: CONCAT
    inputs:
      - filtered_h5ad
      - demultiplexed_tsv
    over: pool_id
    outputs:
      - id: dataset_h5ad
        path: "{name}.h5ad"
    modules:
      - id: concatenate
        name: "Concatenate pools, join species labels"
        software_environment: r_conda
        repository:
          url: https://github.com/omni-scrna/demultiplexing
          commit: 397aa71
          entrypoint: concatenate

  - id: DOUBLET
    inputs:
      - dataset_h5ad
    outputs:
      - id: doublets_tsv
        path: "{name}_doublets.tsv"
    modules:
      - id: scdblfinder
        name: "scDblFinder doublet detection"
        software_environment: r_doublets
        repository:
          url: https://github.com/omni-scrna/doublets-r
          commit: main


